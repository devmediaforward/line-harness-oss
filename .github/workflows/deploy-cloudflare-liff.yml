name: Deploy Cloudflare LIFF

# apps/liff(React SPA・BrowserRouter)を専用の Cloudflare Pages プロジェクトへ
# デプロイする。Worker は自前クライアント(apps/worker/src/client)を配信しており
# apps/liff は含まれないため、独立したデプロイ経路が必要(フォーク側で追加)。
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'apps/liff/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-cloudflare-liff.yml'

concurrency: deploy-liff-${{ github.ref }}

jobs:
  deploy:
    if: github.repository != 'Shudesu/line-harness-oss' && vars.LINE_HARNESS_CLOUDFLARE_DEPLOY == 'true'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @line-crm/shared build

      - name: Build LIFF app
        run: pnpm --filter liff build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          # apps/liff は liff-auth.ts で VITE_DEFAULT_LIFF_ID を参照する(?liffId= が無い場合の既定値)。
          # 値は VITE_LIFF_ID と同一で良いため同じ Variable から注入する。
          VITE_DEFAULT_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_BOT_BASIC_ID: ${{ vars.VITE_BOT_BASIC_ID }}

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIFF_PAGES_PROJECT_NAME: ${{ vars.LIFF_PAGES_PROJECT_NAME || 'your-liff-name' }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler pages deploy apps/liff/dist \
            --project-name="$LIFF_PAGES_PROJECT_NAME" \
            --commit-message="deploy ${GITHUB_SHA}"
